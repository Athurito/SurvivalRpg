interface:
  display_name: "Unreal Lyra Expert"
  short_description: "UE5 Lyra-derived RPG architecture expert"
  default_prompt: "Use $unreal-lyra-expert to inspect the project first, preserve Lyra/RPG ownership, keep native schema and justified mechanics in C++ while concrete abilities and UI presentation remain designer-owned assets, and author Blueprint, UMG, GAS, and DataAsset content through the Unreal MCP workflow."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "unreal-mcp"
      description: "Unreal Editor MCP server for inspecting, authoring, compiling, and saving assets; requires a running editor"
      transport: "streamable_http"
      url: "http://127.0.0.1:8000/mcp"
