+GameplayTagList=(Tag="Rune.Brand",DevComment="Rune identity Brand. Socketed into a harvesting tool, its hits set resources burning; the Aftermath talents need it in the tool.")
+GameplayTagList=(Tag="Rune.Durchschlag",DevComment="Rune identity Durchschlag. Socketed into a harvesting tool, every own hit drives through into the next resource behind the struck one; the Spread talents need it or Erntesprung.")
+GameplayTagList=(Tag="Rune.Echo",DevComment="Rune identity Echo (harvesting). Socketed into a harvesting tool, every third own hit echoes on the struck resource; the Rune Flow talents need it or Kraftuebertrag. Not the engraved combat Echo of CMB-07.")
